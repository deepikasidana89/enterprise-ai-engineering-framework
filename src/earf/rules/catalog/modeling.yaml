rules:
  - id: MOD-001
    title: Model or provider configured
    description: The codebase defines the model or provider used for AI interactions.
    category: modeling
    severity: high
    tier: core
    version: "1.0"
    enabled: true
    applicability:
      all:
        - capability: uses_llm
    rationale: Explicit provider configuration improves reproducibility.
    failure_message: Explicit model or provider configuration evidence was not detected.
    recommendation: Add explicit model/provider configuration settings.
    tags: [model, configuration]
    references: []
    evidence_requirements:
      any:
        - evidence_type: runtime_call
          source: signal
          identifiers: [ai.runtime_call]
        - all:
            - evidence_type: import
              source: signal
              identifiers: [ai.provider_import]
            - evidence_type: configuration
              source: signal
              identifiers: [ai.provider_config, ai.model_config]
        - all:
            - evidence_type: dependency
              identifiers:
                - openai
                - anthropic
                - google-generativeai
                - azure-ai-inference
                - litellm
                - langchain
            - evidence_type: implementation
              source: signal
              identifiers: [ai.gateway_usage]
    metadata: {}

  - id: MOD-002
    title: Model version documented
    description: The repository documents model versions or version pinning strategy.
    category: modeling
    severity: medium
    tier: advanced
    version: "1.0"
    enabled: true
    applicability:
      all:
        - capability: uses_llm
    rationale: Version visibility reduces drift and debugging effort.
    failure_message: Model versioning or pinning evidence was not detected.
    recommendation: Document model versions and update procedures.
    tags: [model, versioning]
    references: []
    evidence_requirements:
      any:
        - evidence_type: configuration
          source: signal
          identifiers: [ai.model_config]
        - evidence_type: code_pattern
          identifiers: [model_config_usage]
    metadata: {}
