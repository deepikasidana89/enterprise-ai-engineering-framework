rules:
  - id: REL-001
    title: Model calls define timeouts
    description: AI model invocations configure explicit timeout values.
    category: reliability
    severity: medium
    tier: core
    version: "1.0"
    enabled: true
    applicability:
      all:
        - capability: uses_llm
    rationale: Timeouts prevent hangs and preserve service stability.
    failure_message: Timeout configuration evidence for model calls was not detected.
    recommendation: Set timeout values for all model calls.
    tags: [reliability, timeout]
    references: []
    evidence_requirements:
      any:
        - evidence_type: implementation
          source: signal
          identifiers: [rel.timeout_runtime]
        - evidence_type: code_pattern
          identifiers: [llm_provider_api_call]
    metadata: {}

  - id: REL-002
    title: Model calls define retry or fallback
    description: AI model calls include retry strategy or fallback behavior.
    category: reliability
    severity: medium
    tier: core
    version: "1.0"
    enabled: true
    applicability:
      all:
        - capability: uses_llm
    rationale: Retries and fallback reduce transient failure impact.
    failure_message: Retry or resilience implementation evidence was not detected.
    recommendation: Implement bounded retries or alternate provider fallback.
    tags: [reliability, retry, fallback]
    references: []
    evidence_requirements:
      any:
        - evidence_type: implementation
          source: signal
          identifiers: [rel.retry_runtime]
        - evidence_type: code_pattern
          identifiers:
            - retry_annotation
            - retry_template
            - resilience4j_retry
            - python_tenacity_retry
            - circuit_breaker_fallback
    metadata: {}
