rules:
  - id: SEC-001
    title: Externalized secret management evidence is present
    description: Repository contains evidence suggesting that credentials and secrets are managed outside application source code.
    category: security
    severity: high
    tier: core
    version: "1.0"
    enabled: true
    applicability:
      always: true
    rationale: Externalized secret management reduces credential exposure risk and supports operational controls.
    failure_message: No supported evidence of externalized secret management was detected.
    recommendation: Integrate a supported secret manager or documented internal secret-management abstraction with implementation evidence.
    tags: [security, secrets]
    references: []
    evidence_requirements:
      any:
        - all:
            - evidence_type: dependency
              identifiers:
                - hvac
                - boto3
                - azure-keyvault-secrets
                - google-cloud-secret-manager
                - aws-secretsmanager-caching
                - '@aws-sdk/client-secrets-manager'
                - '@azure/keyvault-secrets'
                - '@google-cloud/secret-manager'
                - secretsmanager
                - software.amazon.awssdk:secretsmanager
                - com.amazonaws:aws-java-sdk-secretsmanager
                - com.bettercloud:vault-java-driver
            - evidence_type: configuration
              source: secret_management
              identifiers:
                - sec.externalized_secret.vault_usage
                - sec.externalized_secret.aws_usage
                - sec.externalized_secret.azure_usage
                - sec.externalized_secret.gcp_usage
                - sec.externalized_secret.kubernetes_secret_ref
        - evidence_type: configuration
          source: secret_management
          identifiers:
            - sec.externalized_secret.vault_usage
            - sec.externalized_secret.aws_usage
            - sec.externalized_secret.azure_usage
            - sec.externalized_secret.gcp_usage
            - sec.externalized_secret.kubernetes_secret_ref
        - all:
            - evidence_type: file
              identifiers: [.env.example]
            - evidence_type: file
              identifiers: [SECURITY.md]
        - all:
            - evidence_type: configuration
              source: secret_management
              identifiers: [sec.externalized_secret.custom_abstraction]
            - evidence_type: configuration
              source: secret_management
              identifiers: [sec.externalized_secret.sensitive_env_access]
        - all:
            - evidence_type: configuration
              source: secret_management
              identifiers: [sec.externalized_secret.custom_abstraction]
            - evidence_type: file
              identifiers: [SECURITY.md]
    metadata: {}

  - id: SEC-002
    title: Tool access uses least privilege
    description: AI tools and integrations run with constrained permissions.
    category: security
    severity: high
    tier: core
    version: "1.0"
    enabled: true
    applicability:
      all:
        - capability: uses_llm
    rationale: Least privilege limits blast radius of compromised workflows.
    failure_message: Least-privilege access control evidence was not detected.
    recommendation: Restrict tool scopes and runtime permissions.
    tags: [security, least-privilege]
    references: []
    evidence_requirements:
      all:
        - evidence_type: file
          identifiers: [CODEOWNERS]
        - evidence_type: workflow
          identifiers: [ci.yml, ci.yaml]
    metadata: {}
