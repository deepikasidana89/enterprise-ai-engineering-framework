rules:
  - id: EVA-001
    title: AI behavior has automated evaluations
    description: The repository contains automated evaluation checks for AI behavior.
    category: evaluation
    severity: high
    tier: core
    version: "1.0"
    enabled: true
    applicability:
      all:
        - capability: uses_llm
    rationale: Automated evaluations catch regressions before release.
    failure_message: Automated AI evaluation evidence was not detected.
    recommendation: Add repeatable AI evaluation tests to CI workflows.
    tags: [evaluation, testing]
    references: []
    evidence_requirements:
      any:
        - evidence_type: workflow
          identifiers: [ci.yml, ci.yaml, evaluation.yml, evaluation.yaml]
    metadata: {}
