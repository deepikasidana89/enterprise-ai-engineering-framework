rules:
  - id: OBS-001
    title: AI interactions produce logs or telemetry
    description: AI request and response activity is captured for monitoring.
    category: observability
    severity: medium
    tier: core
    version: "1.0"
    enabled: true
    applicability:
      all:
        - capability: uses_llm
    rationale: Telemetry enables incident response and continuous tuning.
    failure_message: AI observability or tracing evidence was not detected.
    recommendation: Add structured logs and telemetry for AI interactions.
    tags: [observability, logging]
    references: []
    evidence_requirements:
      any:
        - evidence_type: dependency
          path: requirements.txt
          identifiers:
            - opentelemetry-api
            - opentelemetry-sdk
            - structlog
            - loguru
            - prometheus-client
        - evidence_type: dependency
          path: pyproject.toml
          identifiers:
            - opentelemetry-api
            - opentelemetry-sdk
            - structlog
            - loguru
            - prometheus-client
    metadata: {}
