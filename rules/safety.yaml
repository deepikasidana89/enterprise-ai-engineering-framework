rules:
  - id: SAF-001
    title: Input validation present
    description: AI input is validated or sanitized before model invocation.
    category: safety
    severity: high
    tier: core
    version: "1.0"
    enabled: true
    applicability:
      all:
        - capability: uses_llm
    rationale: Input validation prevents unsafe or malformed requests.
    failure_message: Input validation evidence was not detected.
    recommendation: Add validation and sanitization checks for AI inputs.
    tags: [safety, input-validation]
    references: []
    evidence_requirements:
      any:
        - evidence_type: implementation
          source: signal
          identifiers: [saf.input_validation_runtime]
        - evidence_type: code_pattern
          identifiers: [pydantic_model_validation, java_validation_annotation, schema_validation_library]
    metadata: {}

  - id: SAF-002
    title: Output guardrails present
    description: AI output is filtered or constrained with safety guardrails.
    category: safety
    severity: high
    tier: core
    version: "1.0"
    enabled: true
    applicability:
      all:
        - capability: uses_llm
    rationale: Output guardrails reduce harmful or policy-violating responses.
    failure_message: Output guardrail evidence was not detected.
    recommendation: Add post-processing or policy checks for model outputs.
    tags: [safety, output-guardrails]
    references: []
    evidence_requirements:
      any:
        - evidence_type: implementation
          source: signal
          identifiers: [saf.output_guardrail_runtime]
    metadata: {}
