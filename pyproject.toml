[project]
name = "earf"
version = "0.7.0"
description = "Enterprise AI Readiness Framework for evaluating the production readiness of enterprise AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Deepika Sidana" }
]

keywords = [
  "enterprise-ai",
  "artificial-intelligence",
  "generative-ai",
  "llm",
  "ai-governance",
  "ai-safety",
  "ai-readiness",
  "ai-evaluation"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
  # keep existing runtime dependencies here
]

[project.optional-dependencies]
dev = [
  "build",
  "mypy",
  "pytest",
  "pytest-cov",
  "ruff",
  "twine"
]

[project.scripts]
earf = "earf.cli:main"

[project.urls]
Homepage = "https://github.com/<your-username>/enterprise-ai-readiness-framework"
Repository = "https://github.com/<your-username>/enterprise-ai-readiness-framework"
Issues = "https://github.com/<your-username>/enterprise-ai-readiness-framework/issues"

[tool.setuptools.package-data]
earf = [
  "rules/**/*.yaml",
  "rules/**/*.yml"
]