[project]
name = "earf"
description = "Enterprise AI Readiness Framework for evaluating the production readiness of enterprise AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dynamic = ["version"]
license-files = ["LICENSE"]

authors = [
  { name = "Deepika Sidana" }
]

keywords = [
  "enterprise-ai",
  "artificial-intelligence",
  "generative-ai",
  "llm",
  "ai-governance",
  "ai-safety",
  "ai-readiness",
  "ai-evaluation"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
  "PyYAML>=6.0",
  "typer>=0.12,<1.0",
  "reportlab>=4.0,<5.0"
]

[project.optional-dependencies]
dev = [
  "build",
  "mypy",
  "pytest",
  "pytest-cov",
  "ruff>=0.5.7,<0.6",
  "types-PyYAML",
  "twine"
]

[project.scripts]
earf = "earf.cli:main"

[project.urls]
Homepage = "https://github.com/<your-username>/enterprise-ai-readiness-framework"
Repository = "https://github.com/<your-username>/enterprise-ai-readiness-framework"
Issues = "https://github.com/<your-username>/enterprise-ai-readiness-framework/issues"

[tool.setuptools.package-data]
earf = [
  "rules/**/*.yaml",
  "rules/**/*.yml"
]

[tool.setuptools.dynamic]
version = { attr = "earf.__about__.__version__" }
