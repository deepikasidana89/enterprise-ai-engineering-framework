[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earf"
version = "0.1.0-dev"
description = "Enterprise AI Readiness Framework (Phase 1 skeleton)"
requires-python = ">=3.11"
dependencies = ["typer>=0.10.0"]

[project.urls]
Home = "https://example.org/earf"

[project.scripts]
earf = "earf.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = 3.11
ignore_missing_imports = true

[project.optional-dependencies]
dev = [
	"pytest>=7.0",
	"pytest-cov",
	"ruff",
	"mypy",
]
