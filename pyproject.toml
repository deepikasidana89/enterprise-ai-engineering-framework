[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earf"
dynamic = ["version"]
description = "Enterprise AI Readiness Framework for evaluating production readiness of AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
	{ name = "EARF Contributors" },
]
keywords = [
	"ai",
	"readiness",
	"governance",
	"risk",
	"evaluation",
	"llm",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Intended Audience :: Information Technology",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Software Development :: Quality Assurance",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["typer>=0.10.0", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/deepikasidana89/enterprise-ai-readiness-framework"
Documentation = "https://github.com/deepikasidana89/enterprise-ai-readiness-framework#readme"
Repository = "https://github.com/deepikasidana89/enterprise-ai-readiness-framework"
Issues = "https://github.com/deepikasidana89/enterprise-ai-readiness-framework/issues"

[project.scripts]
earf = "earf.cli:main"

[tool.setuptools.dynamic]
version = { attr = "earf.__about__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
earf = ["rules/catalog/*.yaml", "rules/catalog/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = 3.11
ignore_missing_imports = true

[project.optional-dependencies]
dev = [
	"pytest>=7.0",
	"pytest-cov",
	"ruff",
	"mypy",
	"build",
	"twine",
]
